# Cody configuration file
# Place this file at ~/.config/cody/config.yaml
# (or $XDG_CONFIG_HOME/cody/config.yaml)

# Path template controls how workspace directories are resolved.
#
# Built-in options:
#   path: default    # ~/code/<codePath>/<host>/<owner>/<repo>
#   path: legacy     # ~/code/<host>/<owner>/<repo>
#
# Custom Go template (available fields: .Home, .Host, .Owner, .Repo, .CodePath):
#   path: "{{.Home}}/src/{{.Host}}/{{.Repo}}"
#   path: "{{.Home}}/projects/{{.CodePath}}/{{.Owner}}-{{.Repo}}"

path: default
